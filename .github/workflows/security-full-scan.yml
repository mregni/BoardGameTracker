name: Security Full Scan (Nightly)

on:
  schedule:
    # Mon-Fri at 01:00 UTC
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RESOURCE_GROUP: bgt-security-scan-${{ github.run_id }}
  AZURE_LOCATION: westeurope

jobs:
  full-scan:
    name: Full Active Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:security-scan-${{ github.run_id }}
          cache-from: type=gha
          build-args: |
            VERSION=0.0.0-security

      - name: Generate ephemeral secrets
        id: secrets
        run: |
          DB_PASSWORD=$(openssl rand -base64 32)
          JWT_SECRET=$(openssl rand -base64 64)
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          echo "db_password=$DB_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "jwt_secret=$JWT_SECRET" >> "$GITHUB_OUTPUT"

      - name: Azure OIDC Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --tags purpose=security-scan run_id="$GITHUB_RUN_ID"

      - name: Deploy Bicep template
        id: deploy
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          SEC_DB_PASSWORD: ${{ steps.secrets.outputs.db_password }}
          SEC_JWT_SECRET: ${{ steps.secrets.outputs.jwt_secret }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/security-scan.bicep \
            --parameters \
              imageName="$IMAGE_REF" \
              dbPassword="$SEC_DB_PASSWORD" \
              jwtSecret="$SEC_JWT_SECRET" \
              registryUsername="$GITHUB_ACTOR" \
              registryPassword="$GHCR_TOKEN" \
            --query "properties.outputs" \
            --output json)

          APP_URL=$(echo "$RESULT" | jq -r '.appUrl.value')
          echo "::add-mask::$APP_URL"
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          echo "Application URL: $APP_URL"

      - name: Wait for application to become healthy
        env:
          APP_URL: ${{ steps.deploy.outputs.app_url }}
        run: |
          set -euo pipefail

          echo "Polling $APP_URL/api/settings ..."

          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "$APP_URL/api/settings" 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Application is healthy"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Application did not become healthy (last HTTP $HTTP_CODE)"
              exit 1
            fi
            sleep 5
          done

      - name: Authenticate and extract JWT
        id: auth
        env:
          ZAP_TEST_USERNAME: ${{ secrets.ZAP_TEST_USERNAME }}
          ZAP_TEST_PASSWORD: ${{ secrets.ZAP_TEST_PASSWORD }}
          APP_URL: ${{ steps.deploy.outputs.app_url }}
        run: |
          set -euo pipefail

          PAYLOAD=$(jq -n \
            --arg u "$ZAP_TEST_USERNAME" \
            --arg p "$ZAP_TEST_PASSWORD" \
            '{username: $u, password: $p}')

          RESPONSE=$(curl -sf -X POST "$APP_URL/api/auth/login" \
            -H "Content-Type: application/json" \
            --data-binary "$PAYLOAD")

          TOKEN=$(printf '%s' "$RESPONSE" | jq -r '.accessToken // empty')

          if [ -z "$TOKEN" ]; then
            echo "::error::Failed to extract JWT from login response"
            exit 1
          fi

          if ! printf '%s' "$TOKEN" | grep -Eq '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'; then
            echo "::error::Login response did not contain a well-formed JWT"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "Authentication successful"

      - name: Validate OpenAPI spec is served
        env:
          APP_URL: ${{ steps.deploy.outputs.app_url }}
        run: |
          set -euo pipefail

          curl -sf "$APP_URL/swagger/v1/swagger.json" -o /tmp/swagger.json

          ENDPOINT_COUNT=$(jq '[.paths | keys[]] | length' /tmp/swagger.json)
          echo "OpenAPI spec contains $ENDPOINT_COUNT endpoint paths"

          if [ "$ENDPOINT_COUNT" -lt 10 ]; then
            echo "::error::OpenAPI spec has suspiciously few endpoints ($ENDPOINT_COUNT)"
            exit 1
          fi

      - name: Run ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: "${{ steps.deploy.outputs.app_url }}/swagger/v1/swagger.json"
          format: openapi
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          allow_issue_writing: false
          fail_action: "false"
          cmd_options: >-
            -z "-config replacer.full_list(0).description=AuthHeader
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=REQ_HEADER
            -config replacer.full_list(0).matchstr=Authorization
            -config replacer.full_list(0).regex=false
            -config replacer.full_list(0).replacement=Bearer\ ${{ steps.auth.outputs.token }}
            -config replacer.full_list(0).initiators="
          rules_file_name: ".zap/rules.tsv"

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('report_sarif.json') != ''
        with:
          sarif_file: report_sarif.json
          category: zap-full-scan

      - name: Upload scan reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-full-scan-reports-${{ github.run_id }}
          path: |
            report_html.html
            report_json.json
            report_md.md
            report_sarif.json
          retention-days: 90

      - name: Collect Azure diagnostics
        if: failure()
        run: |
          az extension add --name containerapp --upgrade || true

          echo "=== bgt-api-sec status ==="
          az containerapp show -g "$RESOURCE_GROUP" -n bgt-api-sec \
            --query "{provisioning: properties.provisioningState, running: properties.runningStatus}" -o json || true
          az containerapp revision list -g "$RESOURCE_GROUP" -n bgt-api-sec -o table || true

          echo "=== bgt-api-sec system log ==="
          az containerapp logs show -g "$RESOURCE_GROUP" -n bgt-api-sec --type system --tail 100 || true

          echo "=== bgt-api-sec console log ==="
          az containerapp logs show -g "$RESOURCE_GROUP" -n bgt-api-sec --type console --tail 100 || true

          echo "=== postgres-bgt-sec console log ==="
          az containerapp logs show -g "$RESOURCE_GROUP" -n postgres-bgt-sec --type console --tail 50 || true

      - name: Delete Azure resource group
        if: always()
        run: |
          az group delete \
            --name "$RESOURCE_GROUP" \
            --yes \
            --no-wait
          echo "Resource group deletion initiated (async)"

  docker-scout:
    name: Docker Scout CVE Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: bgt:scout-scan
          cache-from: type=gha
          build-args: |
            VERSION=0.0.0-security

      - name: Docker Scout CVE scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://bgt:scout-scan
          only-severities: critical,high
          sarif-file: scout-results.sarif
          exit-code: true
          only-fixed: true

      - name: Upload Scout SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: scout-results.sarif
          category: docker-scout

  full-dependency-audit:
    name: Full Frontend Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: boardgametracker.client/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "pnpm"
          cache-dependency-path: boardgametracker.client/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd boardgametracker.client
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit all dependencies (informational)
        continue-on-error: true
        run: |
          cd boardgametracker.client
          pnpm audit --audit-level=moderate
