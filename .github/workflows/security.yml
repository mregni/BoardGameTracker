name: Security Scanning

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan-backend:
    name: Backend Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore packages
        run: dotnet restore ./BoardGameTracker.sln --locked-mode

      - name: Check for vulnerable packages
        run: |
          set -uo pipefail

          : > vulnerable.txt
          for project in BoardGameTracker.*/*.csproj; do
            dotnet list "$project" package --vulnerable --include-transitive 2>&1 | tee -a vulnerable.txt || true
          done

          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

          expected=$(ls BoardGameTracker.*/*.csproj | wc -l)
          verdicts=$(grep -c "has no vulnerable packages" vulnerable.txt || true)
          if [ "$verdicts" -ne "$expected" ]; then
            echo "::error::Expected a vulnerability verdict for $expected projects, got $verdicts"
            exit 1
          fi

          echo "No vulnerable packages found in $expected projects."

  dependency-scan-frontend:
    name: Frontend Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: boardgametracker.client/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: boardgametracker.client/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd boardgametracker.client
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit for vulnerabilities
        run: |
          cd boardgametracker.client
          pnpm audit --audit-level=high --prod

  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Cache Gitleaks
        id: gitleaks-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.gitleaks
          key: gitleaks-8.24.3-linux-x64

      - name: Install Gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          image=ghcr.io/gitleaks/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          for attempt in 1 2 3 4 5; do
            docker pull --quiet "$image" && break
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 15))
          done
          mkdir -p ~/.gitleaks
          container=$(docker create "$image")
          docker cp "$container:/usr/bin/gitleaks" ~/.gitleaks/gitleaks
          docker rm "$container"

      - name: Run Gitleaks
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: ~/.gitleaks/gitleaks git --redact --verbose --exit-code 1 --log-opts="--no-merges --first-parent $RANGE"
