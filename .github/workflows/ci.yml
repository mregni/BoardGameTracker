name: CI

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-analyze:
    name: Test and SonarCloud Analysis
    runs-on: ubuntu-latest
    env:
      SONAR_SCANNER_VERSION: "11.2.1"
      SONAR_PROJECT_KEY: mregni_BoardGameTracker
      SONAR_ORGANIZATION: uping
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Git Semantic Version
        uses: PaulHatch/semantic-version@4d6da96a9bc3116da3613309a11ff75fba58eb8d # v6.0.4
        id: versioning
        with:
          enable_prerelease_mode: true
          namespace: beta
          bump_each_commit: true
          version_format: "${major}.${minor}.${patch}-beta"
          debug: true

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: boardgametracker.client/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.x"
          cache: 'pnpm'
          cache-dependency-path: boardgametracker.client/pnpm-lock.yaml

      - name: Get cache week
        id: cache-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-cache-${{ steps.cache-week.outputs.week }}
          restore-keys: ${{ runner.os }}-sonar-cache-

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner --version "$SONAR_SCANNER_VERSION"

      - name: Install .NET dependencies
        run: dotnet restore ./BoardGameTracker.sln --locked-mode

      - name: Begin SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /v:"$VERSION" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="TestResults/*.trx" \
            /d:sonar.javascript.lcov.reportPaths="$GITHUB_WORKSPACE/boardgametracker.client/coverage/lcov.info" \
            /d:sonar.testExecutionReportPaths="$GITHUB_WORKSPACE/boardgametracker.client/coverage/sonar-report.xml" \
            /d:sonar.exclusions="**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/TestResults/**,**/obj/**,**/bin/**,**/Migrations/**,**/routeTree.gen.ts,**/api.generated.ts,**/openapi/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.webp,**/*.pdf" \
            /d:sonar.coverage.exclusions="**/BoardGameTracker.Host/**/*.cs,**/BoardGameTracker.AppHost/**/*.cs,**/scripts/**,**/src/test/**,**/Migrations/**/*.cs,**/ViewModels/**/*.cs,**/routeTree.gen.ts,**/tailwind.config.js,**/node_modules/**" \
            /d:sonar.cpd.exclusions="**/Migrations/**/*.cs" \
            /d:sonar.typescript.tsconfigPaths="$GITHUB_WORKSPACE/boardgametracker.client/tsconfig.json" \
            /d:sonar.issue.ignore.multicriteria=e1 \
            /d:sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S7637 \
            /d:sonar.issue.ignore.multicriteria.e1.resourceKey="**/.github/**"
        if: env.SONAR_TOKEN != ''

      - name: Build .NET
        run: dotnet build --no-restore

      - name: Export the OpenAPI document
        env:
          ASPNETCORE_ENVIRONMENT: Production
          JWT_SECRET: ci-openapi-export-placeholder-secret-with-32-chars
          DB_HOST: localhost
          DB_USER: openapi
          DB_PASSWORD: ${{ github.run_id }}
          DB_NAME: openapi
          LOGLEVEL: warn
        run: dotnet ./BoardGameTracker.Host/bin/Debug/net10.0/BoardGameTracker.Host.dll --openapi boardgametracker.client/openapi/swagger.json

      - name: Run .NET unit tests
        run: |
          dotnet test ./BoardGameTracker.Tests/BoardGameTracker.Tests.csproj \
            --no-build \
            --no-restore \
            --logger trx \
            --results-directory "TestResults" \
            --collect "XPlat Code Coverage;Format=opencover" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/BoardGameTracker.Host/**/*.cs,**/Migrations/**/*.cs,**/ViewModels/**/*.cs,**/obj/**/*.cs"

      - name: Run .NET integration tests (Testcontainers Postgres)
        run: |
          dotnet test ./BoardGameTracker.IntegrationTests/BoardGameTracker.IntegrationTests.csproj \
            --no-build \
            --no-restore \
            --logger trx \
            --results-directory "TestResults" \
            --collect "XPlat Code Coverage;Format=opencover" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/BoardGameTracker.Host/**/*.cs,**/Migrations/**/*.cs,**/ViewModels/**/*.cs,**/obj/**/*.cs"

      - name: Install frontend dependencies
        run: |
          cd boardgametracker.client
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Check the generated API types
        run: |
          cd boardgametracker.client
          pnpm generate:api
          git diff --exit-code --stat -- openapi src/models/api.generated.ts

      - name: Run Biome format check
        run: |
          cd boardgametracker.client
          pnpm format:check

      - name: Run Biome lint
        run: |
          cd boardgametracker.client
          pnpm lint

      - name: Typecheck frontend
        run: |
          cd boardgametracker.client
          pnpm typecheck

      - name: Run frontend tests with coverage
        run: |
          cd boardgametracker.client
          pnpm test:coverage
          # Convert LCOV/sonar paths to absolute so SonarCloud resolves them regardless of module context
          sed -i "s|^SF:src/|SF:$(pwd)/src/|" coverage/lcov.info
          sed -i "s|path=\"src/|path=\"$(pwd)/src/|g" coverage/sonar-report.xml

      - name: Publish .NET test results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        with:
          files: TestResults/**/*.trx
          check_name: ".NET Test Results"
          fail_on: "test failures"

      - name: End SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
        if: env.SONAR_TOKEN != ''

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: |
            TestResults
            boardgametracker.client/coverage
          retention-days: 7
        if: success() || failure()

      - name: Code Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: "TestResults/**/coverage.opencover.xml;boardgametracker.client/coverage/lcov.info"
          targetdir: "coveragereport"
          reporttypes: "MarkdownSummaryGithub;Cobertura"
          sourcedirs: "boardgametracker.client"
          assemblyfilters: "-BoardGameTracker.Host;-BoardGameTracker.DataStore"
          filefilters: "-**/ViewModels/**;-**/Migrations/**"

      - name: Publish Coverage Summary
        run: cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          recreate: true
          path: coveragereport/SummaryGithub.md

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Build
        run: pnpm build

  build-strict:
    name: Build (warnings as errors)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: |
          dotnet restore BoardGameTracker.Tests/BoardGameTracker.Tests.csproj --locked-mode -p:BuildWithoutEsproj=true
          dotnet restore BoardGameTracker.IntegrationTests/BoardGameTracker.IntegrationTests.csproj --locked-mode -p:BuildWithoutEsproj=true

      - name: Build Release
        run: |
          dotnet build BoardGameTracker.Tests/BoardGameTracker.Tests.csproj -c Release --no-restore -p:BuildWithoutEsproj=true
          dotnet build BoardGameTracker.IntegrationTests/BoardGameTracker.IntegrationTests.csproj -c Release --no-restore -p:BuildWithoutEsproj=true

  docker-image:
    name: Docker image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image (linux/amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
