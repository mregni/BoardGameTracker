name: CI

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-analyze:
    name: Test and SonarCloud Analysis
    runs-on: ubuntu-latest
    env:
      SONAR_SCANNER_VERSION: "11.2.1"
      SONAR_PROJECT_KEY: mregni_BoardGameTracker
      SONAR_ORGANIZATION: uping
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Git Semantic Version
        uses: PaulHatch/semantic-version@502226b17e3e242e4befd0a45690fcbb27dd1373 # v6.0.3
        id: versioning
        with:
          enable_prerelease_mode: true
          namespace: beta
          bump_each_commit: true
          version_format: "${major}.${minor}.${patch}-beta"
          debug: true

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup dotnet v8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: boardgametracker.client/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20.x"
          cache: 'pnpm'
          cache-dependency-path: boardgametracker.client/pnpm-lock.yaml

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner --version "$SONAR_SCANNER_VERSION"

      - name: Install .NET dependencies
        run: dotnet restore ./BoardGameTracker.sln

      - name: Begin SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /v:"$VERSION" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="TestResults/*.trx" \
            /d:sonar.javascript.lcov.reportPaths="coverage/lcov.info" \
            /d:sonar.testExecutionReportPaths="boardgametracker.client/coverage/sonar-report.xml" \
            /d:sonar.exclusions="**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/TestResults/**,**/obj/**,**/bin/**,**/Migrations/**,**/routeTree.gen.ts,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.webp,**/*.pdf" \
            /d:sonar.coverage.exclusions="**/BoardGameTracker.Host/**/*.cs,**/BoardGameTracker.Core/Datastore/**/*.cs,**/Migrations/**/*.cs,**/ViewModels/**/*.cs,**/Entities/**/*.cs,**/routeTree.gen.ts,**/tailwind.config.js,**/node_modules/**" \
            /d:sonar.cpd.exclusions="**/Migrations/**/*.cs" \
            /d:sonar.typescript.tsconfigPaths="boardgametracker.client/tsconfig.json" \
            /d:sonar.issue.ignore.multicriteria=e1 \
            /d:sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S7637 \
            /d:sonar.issue.ignore.multicriteria.e1.resourceKey="**/.github/**"
        if: env.SONAR_TOKEN != ''

      - name: Build .NET
        run: dotnet build --no-restore

      - name: Run .NET tests
        run: |
          dotnet test ./BoardGameTracker.Tests/BoardGameTracker.Tests.csproj \
            --no-build \
            --no-restore \
            --logger trx \
            --results-directory "TestResults" \
            --collect "XPlat Code Coverage;Format=opencover" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/BoardGameTracker.Host/**/*.cs,**/Datastore/**/*.cs,**/Migrations/**/*.cs,**/ViewModels/**/*.cs,**/Entities/**/*.cs,**/obj/**/*.cs"

      - name: Install frontend dependencies
        run: |
          cd boardgametracker.client
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Biome format check
        run: |
          cd boardgametracker.client
          pnpm format:check

      - name: Run Biome lint
        run: |
          cd boardgametracker.client
          pnpm lint

      - name: Typecheck frontend
        run: |
          cd boardgametracker.client
          pnpm typecheck

      - name: Run frontend tests with coverage
        run: |
          cd boardgametracker.client
          pnpm test:coverage
          # Convert LCOV/sonar paths to absolute so SonarCloud resolves them regardless of module context
          sed -i "s|^SF:src/|SF:$(pwd)/src/|" coverage/lcov.info
          sed -i "s|path=\"src/|path=\"$(pwd)/src/|g" coverage/sonar-report.xml

      - name: Publish .NET test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        if: always()
        with:
          files: TestResults/**/*.trx
          check_name: ".NET Test Results"
          fail_on: "test failures"

      - name: End SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
        if: env.SONAR_TOKEN != ''

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: |
            TestResults
            boardgametracker.client/coverage
          retention-days: 7
        if: success() || failure()

      - name: Code Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: "TestResults/**/coverage.opencover.xml;boardgametracker.client/coverage/lcov.info"
          targetdir: "coveragereport"
          reporttypes: "MarkdownSummaryGithub;Cobertura"
          sourcedirs: "boardgametracker.client"
          assemblyfilters: "-BoardGameTracker.Host;-BoardGameTracker.DataStore"
          filefilters: "-**/ViewModels/**;-**/Entities/**"

      - name: Publish Coverage Summary
        run: cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          recreate: true
          path: coveragereport/SummaryGithub.md
