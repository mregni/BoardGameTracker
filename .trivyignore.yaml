vulnerabilities:
  - id: CVE-2026-106110
    purls:
      - "pkg:nuget/SixLabors.ImageSharp@3.1.12"
    statement: Only the TIFF CCITT T4 encoder is affected; the app only decodes images and encodes them as WebP. The fix ships in ImageSharp 4, which needs a Six Labors licence key.
    expired_at: 2027-01-08
  - id: CVE-2026-106113
    purls:
      - "pkg:nuget/SixLabors.ImageSharp@3.1.12"
    statement: Only the HistogramEqualization processor is affected and the app never uses it. The fix ships in ImageSharp 4, which needs a Six Labors licence key.
    expired_at: 2027-01-08
  - id: CVE-2026-106115
    purls:
      - "pkg:nuget/SixLabors.ImageSharp@3.1.12"
    statement: Only the TIFF CCITT T6 encoder is affected; the app only decodes images and encodes them as WebP. The fix ships in ImageSharp 4, which needs a Six Labors licence key.
    expired_at: 2027-01-08
